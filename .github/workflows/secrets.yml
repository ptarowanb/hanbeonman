name: Secret scanning

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download verified Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
      - name: Scan Git history
        run: >-
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git
          --redact=100
          --no-banner
          --no-color
          --log-opts=--all
          .
